name: 🐂 Bull Hunter v2 — بک‌تست واقعی

# این workflow روی سرورهای GitHub اجرا می‌شود که برخلاف sandbox محدود،
# دسترسی کامل به اینترنت (از جمله API صرافی Binance) دارند.

on:
  # اجرای دستی از تب Actions با پارامترهای قابل تنظیم
  workflow_dispatch:
    inputs:
      days:
        description: "تعداد روزهای بک‌تست"
        required: false
        default: "14"
      interval:
        description: "تایم‌فریم کندل (1m, 5m, 15m, 1h)"
        required: false
        default: "5m"
      symbols:
        description: "تعداد ارز از Top200 (200 = همه، برای تست سریع کمتر بدهید مثلاً 20)"
        required: false
        default: "200"
      min_change:
        description: "حداقل رشد ٪ برای سیگنال اولیه"
        required: false
        default: "1.5"
      min_tests:
        description: "حداقل تست‌های لازم از ۹ (نهایی تأییدشده: 5)"
        required: false
        default: "5"
      optimize:
        description: "بهینه‌سازی پارامترها (grid search) برای یافتن بیشترین سود — true/false"
        required: false
        default: "false"
      t9_max_dist:
        description: "فیلتر T9: حداقل فاصله٪ (منفی) از سقف ۲۴ساعته (نهایی: -7.0، برای غیرفعال‌کردن خالی بگذارید)"
        required: false
        default: "-7.0"
      max_hold_hours:
        description: "Time Exit به ساعت (نهایی: 4.0، برای غیرفعال‌کردن خالی بگذارید)"
        required: false
        default: "4.0"
      hard_stop_atr_mult:
        description: "ضریب ATR برای Hard Stop پویا (نهایی: 2.5، برای غیرفعال‌کردن خالی بگذارید)"
        required: false
        default: "2.5"
      max_open_trades:
        description: "محدودیت واقعی معاملات هم‌زمان پورتفولیو (نهایی: 15)"
        required: false
        default: "15"
      reliable_usdt:
        description: "سرمایه هر معامله روی نمادهای قابل‌اعتماد (نهایی: 100)"
        required: false
        default: "100"
      other_usdt:
        description: "سرمایه هر معامله روی بقیه نمادها (نهایی: 40)"
        required: false
        default: "40"

  # اجرای خودکار هفتگی (اختیاری — می‌توانید کامنت یا حذف کنید)
  schedule:
    - cron: "0 3 * * 1"  # هر دوشنبه ساعت 03:00 UTC

permissions:
  contents: write   # برای commit کردن نتایج به ریپو

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: چک‌اوت کد
        uses: actions/checkout@v4

      - name: نصب Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: نصب وابستگی‌ها
        run: pip install -r requirements.txt

      - name: اجرای بک‌تست واقعی روی Binance
        run: |
          python src/backtest_real.py \
            --days "${{ github.event.inputs.days || '14' }}" \
            --interval "${{ github.event.inputs.interval || '5m' }}" \
            --symbols "${{ github.event.inputs.symbols || '200' }}" \
            --min-change "${{ github.event.inputs.min_change || '3.0' }}" \
            --min-tests "${{ github.event.inputs.min_tests || '5' }}" \
            --volume-mult "2.0" \
            --t9-max-dist "${{ github.event.inputs.t9_max_dist || '-7.0' }}" \
            --max-hold-hours "${{ github.event.inputs.max_hold_hours || '4.0' }}" \
            --hard-stop-atr-mult "${{ github.event.inputs.hard_stop_atr_mult || '2.5' }}" \
            --max-open-trades "${{ github.event.inputs.max_open_trades || '15' }}" \
            --reliable-usdt "${{ github.event.inputs.reliable_usdt || '100' }}" \
            --other-usdt "${{ github.event.inputs.other_usdt || '40' }}" \
            --out results \
            --cache-path "data_cache/klines_${{ github.event.inputs.interval || '5m' }}_${{ github.event.inputs.days || '14' }}d.csv.gz" \
            ${{ github.event.inputs.optimize == 'true' && '--optimize' || '' }}

      - name: نمایش خلاصه در لاگ
        run: cat results/report.md

      - name: آپلود نتایج به‌عنوان Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results-${{ github.run_number }}
          path: results/
          retention-days: 90

      - name: Commit نتایج به ریپو (تاریخچه بک‌تست‌ها + کش داده خام)
        run: |
          git config user.name "Bull Hunter Bot"
          git config user.email "actions@github.com"
          mkdir -p history
          cp results/summary.json "history/summary_$(date -u +%Y%m%d_%H%M%S).json" 2>/dev/null || true
          git add results/ history/ data_cache/ 2>/dev/null || true
          git commit -m "📊 بک‌تست واقعی $(date -u +%Y-%m-%d\ %H:%M\ UTC)" || echo "تغییری برای commit نبود"
          git push || echo "push انجام نشد (احتمالاً branch protection)"
